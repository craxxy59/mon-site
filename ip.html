    <h1>
      <h1>Informations sur votre IP et votre Appareil</h1>
      <div id="userIP">Votre IP: Chargement...</div>
      <div id="userDevice">Votre Appareil: Chargement...</div>
      <div id="deviceName">Chargement...</div>
      <script>
        // Fonction pour obtenir l'adresse IP de l'utilisateur
        function getUserIP() {
          fetch('https://api.ipify.org?format=json')
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              document.getElementById('userIP').innerHTML = 'Votre IP: ' + data.ip;
            })
            .catch(function (error) {
              console.log(error);
            });
        }
        // Fonction pour obtenir des informations sur l'appareil de l'utilisateur
        function getUserDevice() {
          var userAgent = navigator.userAgent;
          var deviceType = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream ? 'iOS' : 'non-iOS';
          var os = navigator.platform;
          var browser = navigator.appName;
          document.getElementById('userDevice').innerHTML = 'Votre Appareil: ' + os + ', ' + deviceType + ', ' + browser;
        }
        // Appel des fonctions
        getUserIP();
        getUserDevice();
      </script>
    </h1>

<script>
  // Fonction pour déterminer le nom de l'appareil
  function getDeviceName() {
    var userAgent = navigator.userAgent;
    // Logique pour déterminer le nom de l'appareil
    // Cette logique peut être complexe et dépend de la structure de la chaîne userAgent
    // Ici, nous utilisons une expression régulière simple comme exemple
    var deviceName = userAgent.match(/(iPad|iPhone|iPod|Android|Windows Phone|BlackBerry)/i);
    if (deviceName) {
      return deviceName[0]; // Retourne le premier résultat correspondant
    } else {
      return 'Inconnu'; // Si aucun appareil n'est détecté
    }
  }
  // Affichage du nom de l'appareil
  document.getElementById('deviceName').textContent = 'Nom de l\'Appareil: ' + getDeviceName();
</script>
