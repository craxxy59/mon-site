<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Craxxxy5909</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <meta name="theme-color" content="#0a0a0a">
  <style>
    .chat-wrap{max-width:980px;margin:0 auto;padding:0 24px 24px}
    .chat-page{
      margin:92px auto 0;
      background:var(--surface);border:1px solid var(--border);
      border-radius:20px;box-shadow:var(--shadow-sm);overflow:hidden;
    }
    .chat-head{
      padding:18px 20px;border-bottom:1px solid var(--border);
      display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;
      background:linear-gradient(180deg, var(--surface), var(--bg-soft));
    }
    .chat-head h1{font-size:18px;letter-spacing:-.02em;font-weight:650}
    .chat-head p{font-size:13px;color:var(--text-soft)}
    .chat-messages{height:min(62vh,560px);overflow-y:auto;padding:16px;background:var(--bg-soft);display:flex;flex-direction:column;gap:8px}
    .message{max-width:78%;padding:10px 12px;border-radius:14px;line-height:1.45;animation:pop .22s ease both;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
    .message.own{margin-left:auto;background:var(--text);color:#fff;border-bottom-right-radius:6px}
    .message.other{margin-right:auto;background:#fff;color:var(--text);border:1px solid var(--border);border-bottom-left-radius:6px}
    .message.system{margin:0 auto;max-width:90%;text-align:center;background:#fff;border:1px dashed var(--border);color:var(--text-soft);font-size:12px;font-family:var(--font-mono)}
    .message-meta{font-size:10px;opacity:.8;margin-bottom:4px;font-family:var(--font-mono);letter-spacing:.02em;font-weight:500}
    .chat-controls,.chat-setup,.auth-panel{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
    .chat-setup input,.auth-panel input,#chatInput{border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-size:13.5px;outline:none;background:var(--bg-soft);transition:all .2s ease;min-width:140px}
    .chat-setup input:focus,.auth-panel input:focus,#chatInput:focus{border-color:var(--text);background:#fff;box-shadow:0 0 0 3px rgba(10,10,10,.06)}
    #chatInput{flex:1;border-radius:999px}
    .chat-btn{border:1px solid var(--border);border-radius:999px;padding:10px 16px;font-weight:600;font-size:13px;cursor:pointer;background:var(--surface);transition:all .2s ease}
    .chat-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    #sendBtn{background:var(--text);color:#fff;border-color:var(--text)}
    #clearBtn{background:var(--bg-soft)}
    .admin-note{font-size:11px;color:var(--text-muted);font-family:var(--font-mono)}
    .admin-mode{color:#b91c1c;font-weight:700}
    .message-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .mini-btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:999px;font-size:11px;padding:4px 8px;cursor:pointer;font-family:var(--font-mono)}
    .danger-btn{border-color:#fecaca;color:#991b1b;background:#fff1f2}
    @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:760px){.chat-wrap{padding:0 16px 16px}.chat-page{margin-top:72px;border-radius:16px}.chat-setup,.auth-panel{flex-direction:column}.chat-setup input,.auth-panel input{width:100%}}
  </style>
</head>
<body>
  <div class="noise"></div><div class="bg-grid"></div>
  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo"><span class="logo-mark">●</span><span class="logo-text">CRAXXXY5909</span><span class="logo-sub">/ chat</span></a>
      <nav class="nav"><ul>
        <li><a href="cours.html" class="nav-link"><span>Cours</span></a></li>
        <li><a href="html.html" class="nav-link"><span>Code</span></a></li>
        <li><a href="chat.html" class="nav-link" style="background:var(--bg-soft);color:var(--text)"><span>Chat</span></a></li>
        <li><a href="ip.html" class="nav-link"><span>Outils</span></a></li>
      </ul></nav>
      <div class="header-actions"><a href="index.html" class="btn btn-ghost">Accueil</a><button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><span></span><span></span></button></div>
    </div>
    <div class="mobile-nav" id="mobileNav"><div class="mobile-nav-inner"><a href="index.html">Accueil</a><a href="cours.html">Cours</a><a href="html.html">Code</a><a href="ip.html">Outils</a><div class="mobile-footer"><span>chat live</span><span>© 2026</span></div></div></div>
  </header>

  <div class="chat-wrap">
    <div class="chat-page">
      <div class="chat-head">
        <div><h1>Chat du site</h1><p>Discussion instantanée • épurée</p></div>
        <div style="text-align:right"><p id="adminState" class="admin-note">Mode utilisateur</p><p class="admin-note" style="margin-top:4px">Salon: <span class="mono" id="roomLabel">general</span></p></div>
      </div>
      <form id="authForm" class="auth-panel">
        <input id="authEmail" type="email" placeholder="Email" required>
        <input id="authPassword" type="password" placeholder="Mot de passe" minlength="6" required>
        <input id="authUsername" type="text" placeholder="Pseudo public" maxlength="24" required>
        <button id="registerBtn" class="chat-btn" type="button">Créer compte</button>
        <button id="loginBtn" class="chat-btn" type="button">Connexion</button>
      </form>
      <form id="setupForm" class="chat-setup">
        <input id="usernameInput" type="text" placeholder="Pseudo" maxlength="24" required disabled>
        <input id="roomInput" type="text" placeholder="Salon" maxlength="32" required>
        <input id="adminCodeInput" type="password" placeholder="Code admin (optionnel)" maxlength="80">
        <button id="joinBtn" class="chat-btn" type="submit" disabled>Rejoindre →</button>
      </form>
      <div id="chatMessages" class="chat-messages"></div>
      <form id="chatForm" class="chat-controls">
        <input id="chatInput" type="text" placeholder="Écris ton message…" autocomplete="off" required disabled>
        <button id="sendBtn" class="chat-btn" type="submit">Envoyer</button>
        <button id="clearBtn" class="chat-btn" type="button">Vider</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved, onValue, query, limitToLast, remove, update, set, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyD49IE1sXKLnM0ejFfK3mWDXy4Ydb1RGGA",
      authDomain: "chat-3c477.firebaseapp.com",
      databaseURL: "https://chat-3c477-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "chat-3c477",
      storageBucket: "chat-3c477.firebasestorage.app",
      messagingSenderId: "602565349913",
      appId: "1:602565349913:web:528e20a5e5cd2e88281088",
      measurementId: "G-QMM8HQ1M06"
    };
    const app = initializeApp(firebaseConfig);
    try{getAnalytics(app);}catch{}
    const auth = getAuth(app);
    const db = getDatabase(app);
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");
    const clearBtn = document.getElementById("clearBtn");
    const setupForm = document.getElementById("setupForm");
    const usernameInput = document.getElementById("usernameInput");
    const roomInput = document.getElementById("roomInput");
    const adminCodeInput = document.getElementById("adminCodeInput");
    const adminState = document.getElementById("adminState");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authUsername = document.getElementById("authUsername");
    const registerBtn = document.getElementById("registerBtn");
    const loginBtn = document.getElementById("loginBtn");
    const joinBtn = document.getElementById("joinBtn");
    const authForm = document.getElementById("authForm");
    const roomLabel = document.getElementById("roomLabel");
    const localNameKey = "mon-site-chat-username";
    const localRoomKey = "mon-site-chat-room";
    const ADMIN_PASSCODE = "5909";
    const ADMIN_UIDS = ["WoGHqUvQzsO6dMUHkLzecWnc7hJ3"];
    let currentUser = "";let currentRoom = "";let started=false;let isAdmin=false;let isModerator=false;let currentMessagesRef=null;let currentRoleRef=null;let currentMemberRef=null;let currentAuthUser=null;
    usernameInput.value = localStorage.getItem(localNameKey)||"";roomInput.value = localStorage.getItem(localRoomKey)||"general";roomLabel.textContent=roomInput.value;
    function formatTime(ts){const d=new Date(ts);return d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
    function addSystemMessage(text){const div=document.createElement("div");div.className="message system";div.textContent=text;chatMessages.appendChild(div);chatMessages.scrollTop=chatMessages.scrollHeight}
    async function setRoleForUser(uid,role){if(!isAdmin||!currentRoom)return;await set(ref(db,"rooms/"+currentRoom+"/roles/"+uid),role)}
    async function banUser(uid,name,dur){if(!isAdmin||!currentRoom)return;const until=dur?Date.now()+dur:0;await set(ref(db,"rooms/"+currentRoom+"/bans/"+uid),{by:currentAuthUser.uid,byName:currentUser,reason:"moderation",bannedAt:Date.now(),bannedUntil:until});await push(currentMessagesRef,{user:"SYSTEM",uid:"system",text:name+" a été banni"+(dur?" temporairement.":"."),createdAt:Date.now()})}
    async function kickUser(uid,name){if(!isAdmin||!currentRoom)return;await set(ref(db,"rooms/"+currentRoom+"/kicks/"+uid),{by:currentAuthUser.uid,byName:currentUser,at:Date.now()});await push(currentMessagesRef,{user:"SYSTEM",uid:"system",text:name+" a été expulsé du salon.",createdAt:Date.now()})}
    function canModerate(){return isAdmin||isModerator}
    function addChatMessage(key,data){
      const role=data.user===currentUser?"own":"other";
      const wrapper=document.createElement("div");wrapper.className="message "+role;wrapper.dataset.key=key;
      const meta=document.createElement("div");meta.className="message-meta";meta.textContent=data.user+" · "+formatTime(data.createdAt||Date.now());
      const body=document.createElement("div");body.className="message-body";body.textContent=data.text;
      wrapper.appendChild(meta);wrapper.appendChild(body);
      if(canModerate()&&data.uid!=="system"){
        const actions=document.createElement("div");actions.className="message-actions";
        const editBtn=document.createElement("button");editBtn.type="button";editBtn.className="mini-btn";editBtn.textContent="Modifier";
        editBtn.addEventListener("click",async()=>{const upd=prompt("Modifier:",body.textContent||"");if(upd===null)return;const nv=upd.trim();if(!nv)return;await update(ref(db,"rooms/"+currentRoom+"/messages/"+key),{text:nv,editedAt:Date.now(),editedBy:currentUser})});
        const delBtn=document.createElement("button");delBtn.type="button";delBtn.className="mini-btn";delBtn.textContent="Supprimer";
        delBtn.addEventListener("click",async()=>{if(!confirm("Supprimer ce message ?"))return;await remove(ref(db,"rooms/"+currentRoom+"/messages/"+key))});
        actions.appendChild(editBtn);actions.appendChild(delBtn);
        if(isAdmin){
          const kickBtn=document.createElement("button");kickBtn.className="mini-btn danger-btn";kickBtn.textContent="Kick";kickBtn.addEventListener("click",()=>kickUser(data.uid,data.user));
          const ban10=document.createElement("button");ban10.className="mini-btn danger-btn";ban10.textContent="Ban 10m";ban10.addEventListener("click",()=>banUser(data.uid,data.user,10*60*1000));
          const banPerm=document.createElement("button");banPerm.className="mini-btn danger-btn";banPerm.textContent="Ban perm";banPerm.addEventListener("click",()=>banUser(data.uid,data.user,0));
          const modBtn=document.createElement("button");modBtn.className="mini-btn";modBtn.textContent="Mod";modBtn.addEventListener("click",()=>setRoleForUser(data.uid,"mod"));
          const unmod=document.createElement("button");unmod.className="mini-btn";unmod.textContent="Retirer";unmod.addEventListener("click",()=>setRoleForUser(data.uid,"user"));
          actions.append(kickBtn,ban10,banPerm,modBtn,unmod);
        }
        wrapper.appendChild(actions);
      }
      chatMessages.appendChild(wrapper);chatMessages.scrollTop=chatMessages.scrollHeight;
    }
    function updateChatMessage(k,d){const w=chatMessages.querySelector('[data-key="'+k+'"]');if(!w)return;const b=w.querySelector(".message-body");const m=w.querySelector(".message-meta");if(b)b.textContent=d.text||"";if(m){const ed=d.editedAt?" (modifié)":"";m.textContent=(d.user||"user")+" · "+formatTime(d.createdAt||Date.now())+ed}}
    function removeChatMessage(k){const w=chatMessages.querySelector('[data-key="'+k+'"]');if(w)w.remove()}
    function startRoom(){
      if(started)return;started=true;chatInput.disabled=false;chatInput.focus();roomLabel.textContent=currentRoom;addSystemMessage("Connecté au salon #"+currentRoom);
      currentMessagesRef=ref(db,"rooms/"+currentRoom+"/messages");
      currentRoleRef=ref(db,"rooms/"+currentRoom+"/roles/"+currentAuthUser.uid);
      currentMemberRef=ref(db,"rooms/"+currentRoom+"/members/"+currentAuthUser.uid);
      onValue(currentRoleRef,snap=>{const role=snap.val()||"user";isModerator=role==="mod";if(!isAdmin){adminState.textContent=isModerator?"Mode modérateur":"Mode utilisateur";adminState.classList.toggle("admin-mode",isModerator)}});
      onValue(ref(db,"rooms/"+currentRoom+"/kicks/"+currentAuthUser.uid),snap=>{if(!snap.exists())return;addSystemMessage("Tu as été expulsé.");chatInput.disabled=true;joinBtn.disabled=true});
      onValue(ref(db,"rooms/"+currentRoom+"/bans/"+currentAuthUser.uid),snap=>{if(!snap.exists())return;const b=snap.val();const perm=!b.bannedUntil||b.bannedUntil===0;const active=perm||b.bannedUntil>Date.now();if(active){addSystemMessage("Tu es banni de ce salon.");chatInput.disabled=true;joinBtn.disabled=true}});
      const q=query(currentMessagesRef,limitToLast(80));
      onChildAdded(q,s=>{const d=s.val();if(!d||!d.text||!d.user)return;addChatMessage(s.key,d)});
      onChildChanged(q,s=>{const d=s.val();if(!d)return;updateChatMessage(s.key,d)});
      onChildRemoved(q,s=>removeChatMessage(s.key));
      chatForm.addEventListener("submit",async e=>{e.preventDefault();const v=chatInput.value.trim();if(!v)return;chatInput.value="";await push(currentMessagesRef,{user:currentUser,uid:currentAuthUser.uid,text:v,createdAt:Date.now()})});
      clearBtn.addEventListener("click",async()=>{if(!canModerate()){addSystemMessage("Réservé admin/mod.");return}if(!confirm("Supprimer tous les messages #"+currentRoom+" ?"))return;await remove(currentMessagesRef);chatMessages.innerHTML="";addSystemMessage("Salon vidé.")});
      set(currentMemberRef,{uid:currentAuthUser.uid,username:currentUser,email:currentAuthUser.email||"",joinedAt:Date.now()});
    }
    setupForm.addEventListener("submit",e=>{
      e.preventDefault();if(!currentAuthUser){addSystemMessage("Connecte-toi d'abord.");return}
      const user=usernameInput.value.trim();const room=roomInput.value.trim().toLowerCase().replace(/\s+/g,"-");if(!user||!room)return;
      isAdmin=adminCodeInput.value.trim()===ADMIN_PASSCODE;
      currentUser=user.slice(0,24);currentRoom=room.slice(0,32);
      localStorage.setItem(localNameKey,currentUser);localStorage.setItem(localRoomKey,currentRoom);
      usernameInput.disabled=true;roomInput.disabled=true;adminCodeInput.disabled=true;joinBtn.disabled=true;
      if(isAdmin){adminState.textContent="Mode admin actif";adminState.classList.add("admin-mode");set(ref(db,"rooms/"+currentRoom+"/roles/"+currentAuthUser.uid),"admin")}
      else if(ADMIN_UIDS.includes(currentAuthUser.uid)){isAdmin=true;adminState.textContent="Mode admin actif (UID)";adminState.classList.add("admin-mode");set(ref(db,"rooms/"+currentRoom+"/roles/"+currentAuthUser.uid),"admin")}
      startRoom();
    });
    registerBtn.addEventListener("click",async()=>{
      const email=authEmail.value.trim();const pw=authPassword.value.trim();const uname=authUsername.value.trim();if(!email||!pw||!uname)return;
      try{const cred=await createUserWithEmailAndPassword(auth,email,pw);await set(ref(db,"users/"+cred.user.uid),{uid:cred.user.uid,email,username:uname.slice(0,24),globalRole:"user",createdAt:Date.now()});usernameInput.value=uname.slice(0,24);addSystemMessage("Compte créé. Connecté.")}catch(err){addSystemMessage("Erreur création: "+(err.message||"inconnue"))}
    });
    loginBtn.addEventListener("click",async()=>{
      const email=authEmail.value.trim();const pw=authPassword.value.trim();if(!email||!pw)return;
      try{await signInWithEmailAndPassword(auth,email,pw);addSystemMessage("Connexion réussie.")}catch(err){addSystemMessage("Erreur connexion: "+(err.message||"inconnue"))}
    });
    onAuthStateChanged(auth,async user=>{
      currentAuthUser=user;
      if(!user){joinBtn.disabled=true;usernameInput.disabled=true;adminState.textContent="Mode utilisateur";return}
      const snap=await get(ref(db,"users/"+user.uid));
      if(snap.exists()){
        const p=snap.val();if(p.username)usernameInput.value=p.username;authUsername.value=p.username||authUsername.value;
        if(p.globalRole==="admin"){isAdmin=true;adminState.textContent="Mode admin global";adminState.classList.add("admin-mode")}
      }
      if(ADMIN_UIDS.includes(user.uid)){isAdmin=true;adminState.textContent="Mode admin global (UID)";adminState.classList.add("admin-mode")}
      joinBtn.disabled=false;usernameInput.disabled=false;
      authForm.querySelectorAll("input,button").forEach(el=>el.disabled=true);
      addSystemMessage("Connecté en tant que "+(usernameInput.value||user.email));
    });
  </script>
</body>
</html>
